services:
  - type: web
    name: anemiawatch-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://anemiawatch.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
